# SubGen — despliegue distribuido en Hetzner. Ver DEPLOYMENT.md para la
# guía completa y el razonamiento de esta topología (por qué agrupar
# api+redis+minio en una VPS chica, por qué CCX y no CPX para los
# workers, cómo repartir el presupuesto).
#
# Docker Compose no orquesta multi-host por sí solo (por eso el enunciado
# original pedía explícitamente NO usar Kubernetes/Swarm): la forma de
# "desplegar distribuido" con compose solo es copiar ESTE MISMO archivo a
# cada VPS y, en cada una, levantar ÚNICAMENTE lo que le corresponde:
#
#   VPS "app" (api + redis + minio, todo junto, tráfico liviano):
#     docker compose -f docker-compose.prod.yml up -d api redis
#     # + minio si autohosteás storage (ver perfil selfhosted-storage abajo)
#
#   Cada VPS de worker (CPU al 100% sostenido, línea CCX recomendada):
#     docker compose -f docker-compose.prod.yml up -d worker-1   # (o worker-2, worker-3...)
#
# api, redis y minio quedan en la MISMA VPS a propósito -- entre ellos se
# hablan por la red interna de Docker (nombre de servicio, sin exponer
# puertos al host) salvo por lo que necesita alcance desde AFUERA de esa
# VPS: redis por la red privada (los workers están en otras VPS) y minio
# tanto por la red privada (workers) como pública (el navegador del
# usuario necesita bajar el archivo final vía URL pre-firmada).
#
# Agregá más bloques `worker-N` (calcando worker-2) según cuántas VPS de
# worker tengas presupuestadas -- no hay límite fijo, a diferencia del
# diseño anterior de "1 VPS = 1 servicio" que dejaba redis/api con casi
# nada que hacer mientras el worker era el único bajo presión real.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Bindear al puerto de la red PRIVADA, nunca 0.0.0.0 en producción --
    # lo necesitan alcanzar las VPS de worker, no internet.
    ports:
      - "${PRIVATE_IP:-0.0.0.0}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    profiles: ["selfhosted-storage"]
    command: server /data --console-address ":9001"
    env_file: .env
    # A diferencia de redis, este SÍ necesita alcance público (además del
    # privado): el navegador del usuario descarga directo desde acá vía
    # URL pre-firmada. Si preferís no exponer MinIO a internet, usá
    # Hetzner Object Storage / AWS S3 en vez de autohostear (ver
    # DEPLOYMENT.md) -- es la alternativa más simple para este punto
    # puntual.
    ports:
      - "9000:9000"
      - "${PRIVATE_IP:-0.0.0.0}:9001:9001"   # consola de administración: privada nomás
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - minio-data:/data

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: subgen-api:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:8000"   # o 443 detrás de un reverse proxy con TLS, ver DEPLOYMENT.md
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker-1:
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: subgen-worker:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${YTDLP_COOKIES_FILE_HOST:-/dev/null}:/worker/cookies.txt:ro
      - whisper-cache:/home/subgen/.cache/huggingface
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info", "--concurrency=1", "-B"]
    healthcheck:
      test: ["CMD", "python", "-c", "from app.celery_app import celery_app; celery_app.control.ping(timeout=5) or exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker-2:
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: subgen-worker:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${YTDLP_COOKIES_FILE_HOST:-/dev/null}:/worker/cookies.txt:ro
      - whisper-cache:/home/subgen/.cache/huggingface
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    healthcheck:
      test: ["CMD", "python", "-c", "from app.celery_app import celery_app; celery_app.control.ping(timeout=5) or exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker-3:
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: subgen-worker:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${YTDLP_COOKIES_FILE_HOST:-/dev/null}:/worker/cookies.txt:ro
      - whisper-cache:/home/subgen/.cache/huggingface
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    healthcheck:
      test: ["CMD", "python", "-c", "from app.celery_app import celery_app; celery_app.control.ping(timeout=5) or exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  redis-data:
  minio-data:
  whisper-cache:
