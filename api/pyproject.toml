[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subgen-api"
version = "1.0.0"
description = "SubGen - API FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109,<1",
    "uvicorn[standard]>=0.27,<1",
    "celery[redis]>=5.3,<6",
    "redis>=5.0,<6",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "boto3>=1.34",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.26",
    "mypy>=1.7",
    "types-redis",
    "boto3-stubs[s3]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests"]

[tool.pytest.ini_options]
# Se corren explícitamente por archivo (ver README, "cómo correr los
# tests"): tests/test_api.py e tests/test_pipeline.py importan `app.main` y
# `app.pipeline` respectivamente, y como cada servicio instala su PROPIO
# paquete top-level llamado `app`, mezclarlos con auto-discovery en el
# mismo proceso rompe el import del que no corresponde a este venv.
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing"
